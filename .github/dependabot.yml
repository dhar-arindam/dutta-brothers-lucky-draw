version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      non-security-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint refuses to run against TS 7.0 ("typescript-eslint does not support
      # TS 7.0"), which fails `npm run lint` in every workspace. Lint is a required quality gate,
      # so TS 7 cannot be adopted until typescript-eslint ships support. Remove this entry then.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Workflow actions are pinned to commit SHAs, so this is the only mechanism that keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
