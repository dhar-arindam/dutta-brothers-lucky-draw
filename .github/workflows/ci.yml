name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Node and npm versions
        run: |
          node --version
          npm --version

      - name: Build frontend assets for infrastructure tests and synth
        run: npm run build --workspace frontend

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Coverage quality gate
        run: npm run test:coverage

      - name: Build remaining workspaces
        run: npm run build --workspace backend --workspace infrastructure --workspace shared

      - name: CDK synth
        run: npm run cdk:synth:dev

      - name: Package validated source artifact
        # git archive only captures committed files, so it drops gitignored build output
        # (frontend/dist) that CDK's BucketDeployment needs; tar the built working tree instead.
        # Write outside the tree being archived so tar doesn't see its own output file appear mid-read.
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=cdk.out -czf /tmp/validated-source.tar.gz .
          mv /tmp/validated-source.tar.gz validated-source.tar.gz

      - name: Upload validated source artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-source
          path: validated-source.tar.gz
          if-no-files-found: error
