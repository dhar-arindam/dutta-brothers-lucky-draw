name: destroy-staging

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY_STAGING to confirm staged resource cleanup"
        required: true
        type: string

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  STAGING_STACK_NAME: DuttaDrawFoundationStackStaging

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  destroy-staging:
    if: ${{ github.event.inputs.confirm_destroy == 'DESTROY_STAGING' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets for CDK synth
        run: npm run build --workspace frontend

      - name: Configure AWS credentials (OIDC staging role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account and region
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCOUNT_ID:-}" ]; then
            echo "AWS_ACCOUNT_ID repository variable is not set"
            exit 1
          fi
          ACTUAL_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$ACTUAL_ACCOUNT_ID" != "${AWS_ACCOUNT_ID}" ]; then
            echo "Unexpected AWS account: $ACTUAL_ACCOUNT_ID"
            exit 1
          fi
          # AWS_REGION is fixed by the workflow env block, so it can't reveal a credentials-step failure;
          # AWS_DEFAULT_REGION is only ever set by the configure-aws-credentials step, making it the real signal
          if [ -z "${AWS_DEFAULT_REGION:-}" ]; then
            echo "AWS_DEFAULT_REGION was not set by the credentials step"
            exit 1
          fi
          if [ "${AWS_DEFAULT_REGION}" != "${AWS_REGION}" ]; then
            echo "Unexpected AWS region: ${AWS_DEFAULT_REGION}"
            exit 1
          fi

      - name: Destroy staging stack only
        run: npm run cdk:destroy:staging -- --force

  invalid-confirmation:
    if: ${{ github.event.inputs.confirm_destroy != 'DESTROY_STAGING' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail due to missing explicit confirmation
        run: |
          echo "Explicit confirmation missing. Provide DESTROY_STAGING."
          exit 1
